name: nabrila
description: >-
  Bug reports from a tester's phone: annotated screenshot, taps, route, console
  and HTTP calls in one encrypted link. Copy it to Claude Code or Cursor.
version: 0.1.0
homepage: https://nabrila.com
repository: https://github.com/nabrila/nabrila_flutter
issue_tracker: https://github.com/nabrila/nabrila_flutter/issues
documentation: https://nabrila.com/docs
topics:
  - bug-report
  - debugging
  - qa
  - encryption
  - feedback

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  dio: ^5.11.1
  http: ^1.6.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  go_router: 18.1.4

flutter:
  plugin:
    platforms:
      android:
        package: com.nabrila.sdk
        pluginClass: NabrilaPlugin
      ios:
        pluginClass: NabrilaPlugin
