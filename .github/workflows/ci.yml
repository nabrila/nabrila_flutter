# Copied from the Nabrila monorepo by scripts/sync-mirror.mjs; edit it there, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA (tag in the comment) so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # The version the SDK is tested with. Raised on purpose, never by a new stable: 3.50
          # deprecates package:flutter/material.dart, and `flutter analyze` fails on that.
          flutter-version: 3.47.6
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: dart pub publish --dry-run
